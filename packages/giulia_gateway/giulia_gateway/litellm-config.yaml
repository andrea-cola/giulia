# LiteLLM Router configuration for the Giulia Gateway.
#
# Every deployment points at a Vertex AI model. `vertex_project` and
# `drop_params` are identical across all entries, so they are factored out
# into the `&defaults` anchor and merged into each `litellm_params` block
# with `<<: *defaults`.
#
# Models with two entries for the same `model_name` (one per
# `vertex_location`) are intentional: the LiteLLM Router load-balances
# across them (routing_strategy="simple-shuffle" in app.py), which spreads
# traffic across regions and doubles the effective quota for that model.
x-defaults: &defaults
  vertex_project: "${VERTEX_PROJECT}"
  drop_params: true

model_list:
  # ── Gemini ────────────────────────────────────────────────────────────
  - model_name: gemini-2.5-flash
    litellm_params:
      <<: *defaults
      model: vertex_ai/gemini-2.5-flash
      vertex_location: "europe-west1"

  - model_name: gemini-3-flash-preview
    litellm_params:
      <<: *defaults
      model: vertex_ai/gemini-3-flash-preview
      vertex_location: "global"

  - model_name: gemini-3-pro-preview
    litellm_params:
      <<: *defaults
      model: vertex_ai/gemini-3-pro-preview
      vertex_location: "global"

  - model_name: gemini-3.1-pro-preview
