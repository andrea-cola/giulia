[project]
name = "giulia-gateway"
version = "0.1.0"
description = "LLM Gateway — FastAPI app bridging Cursor IDE to Vertex AI via LiteLLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloud-sql-python-connector[asyncpg]>=1.12.0",
    "fastapi>=0.135.1",
    "google-auth>=2.48.0",
    "google-cloud-aiplatform>=1.139.0",
    "httpx>=0.28.1",
    "litellm>=1.72.0",
    "orjson>=3.9.0",
    "pyyaml>=6.0",
    "uvicorn>=0.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["giulia_gateway"]
