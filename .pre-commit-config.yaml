repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, refactor, test, ci, build, perf, style, revert]

  - repo: local
    hooks:
      - id: pyright
        name: Type check (pyright)
        entry: uv run --frozen pyright
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: bump-version
        name: Bump giulia version
        entry: scripts/bump-version.sh
        language: script
        files: ^packages/giulia/giulia/
        exclude: ^packages/giulia/pyproject\.toml$
        pass_filenames: false
        stages: [pre-commit]
