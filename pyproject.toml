# Root workspace configuration.
# Each publishable package lives in packages/<name>/ and has its own pyproject.toml.
# This file owns: uv workspace membership, shared tooling config, and dev dependencies.

[tool.uv.workspace]
members = [
    "packages/giulia",
    "packages/giulia_cli",
    "packages/giulia_sdk",
]

# ---------------------------------------------------------------------------
# Shared linter / formatter
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # function calls in default arguments (Depends-style patterns)
]

# ---------------------------------------------------------------------------
# Type checker
# ---------------------------------------------------------------------------

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
ignore = [".venv"]

# ---------------------------------------------------------------------------
# Test runner
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# Legacy mypy (kept for IDE compatibility)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["\\.venv/"]

# ---------------------------------------------------------------------------
# Workspace-level dev dependencies (shared across all packages)
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "types-pyyaml>=6.0.12.20260408",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.0.0",
]
