# Root workspace configuration.
# Each publishable package lives in packages/<name>/ and has its own pyproject.toml.
# This file owns: uv workspace membership, shared tooling config, and dev dependencies.

[tool.uv.workspace]
members = [
    "packages/giulia",
    "packages/giulia_cli",
    "packages/giulia_gateway",
    "packages/giulia_sdk",
]

# ---------------------------------------------------------------------------
# Shared linter / formatter
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # function calls in default arguments (Depends-style patterns)
]

# ---------------------------------------------------------------------------
# Type checker
# ---------------------------------------------------------------------------

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
ignore = [".venv", "templates/"]

# Suppressed intentionally:
# - reportMissingImports / reportMissingModuleSource: GCP/cloud extras (vertexai,
#   google.cloud.sql, opentelemetry) are only present with [gcp]. Missing in CI.
# - reportUnsupportedDunderAll: __init__.py files use __getattr__ for lazy loading;
#   pyright cannot statically trace symbols returned by __getattr__.
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportUnsupportedDunderAll = "none"

# Tell pyright where packages live so relative imports inside packages/giulia resolve.
extraPaths = ["packages/giulia"]

# ---------------------------------------------------------------------------
# Legacy mypy (kept for IDE compatibility)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["\\.venv/"]

# ---------------------------------------------------------------------------
# Workspace-level dev dependencies (shared across all packages)
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "types-pyyaml>=6.0.12.20260408",
    "pyright>=1.1.0",
]
