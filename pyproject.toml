[project]
name = "giulia"
version = "0.1.5"
description = "White-label agent framework: registry discovery, registration, A2A, and cryptographic identity"
requires-python = ">=3.12"
dependencies = [
    # Core — always required
    "python-dotenv>=1.0.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "loguru>=0.7.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "cachetools>=5.5.0",
    "starlette>=0.41.0",
    "PyJWT>=2.9.0",
    "redis[hiredis]>=5.2.0",
    "a2a-sdk[http-server]>=0.3.25,<1.0.0",
    "pyyaml>=6.0.0",
    "asyncpg>=0.30.0",
    "google-adk[mcp]>=1.23.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
# GCP provider implementations: Secret Manager, KMS, Cloud SQL, Memorystore IAM auth
gcp = [
    "google-cloud-kms>=2.24.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-pubsub>=2.29.0",
    "google-cloud-storage>=2.18.0",
    "google-apps-chat>=0.9.0",
    "google-auth>=2.0.0",
    "cloud-sql-python-connector[asyncpg]>=1.15.0",
    "greenlet>=3.1.1",
]
# Full GCP install (convenience alias)
all = [
    "giulia[gcp]",
]

[tool.hatch.build.targets.wheel]
packages = ["giulia"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # function calls in default arguments (Depends-style patterns)
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = [
    "\\.venv/",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "types-pyyaml>=6.0.12.20260408",
]
