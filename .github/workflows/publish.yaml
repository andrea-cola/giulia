name: Publish to PyPI

# Triggered automatically when ci.yaml pushes a version tag to main
# (e.g. v0.1.13). Tags are created by the "tag" job in ci.yaml whenever a
# green push to main carries a version not yet tagged — so you never push
# tags manually.
#
# Required repository secret:
#   PYPI_API_TOKEN — an API token from pypi.org scoped to this project.
#
# Trusted publishing (OIDC) is preferred over a long-lived token.
# To enable it, configure a "GitHub Actions" publisher on PyPI at:
#   https://pypi.org/manage/project/giulia/settings/publishing/
# and replace the token-based upload step with the oidc variant below.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # e.g. v0.1.13
      - "v[0-9]+.[0-9]+.[0-9]+.post*"  # e.g. v0.1.13.post1

permissions:
  contents: read
  # Required for OIDC trusted publishing (uncomment if you switch to OIDC):
  # id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build the wheel + sdist
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        working-directory: packages/giulia
        run: uv build --out-dir ../../dist

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"          # strip leading 'v'
          PKG=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('giulia'))")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package version $PKG"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Publish to PyPI
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/giulia/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # a "GitHub Actions" publisher at pypi.org/manage/project/giulia/.
      #
      # - name: Publish to PyPI (OIDC)
      #   uses: pypa/gh-action-pypi-publish@release/v1
