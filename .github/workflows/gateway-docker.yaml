name: Gateway Docker

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "packages/giulia_gateway/**"

jobs:
  docker:
    name: Build & push gateway image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::7}"
          TAGS="andreacola/giulia-gateway:${SHA}"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS="${TAGS},andreacola/giulia-gateway:stable"
          elif [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            TAGS="${TAGS},andreacola/giulia-gateway:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/giulia_gateway
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
