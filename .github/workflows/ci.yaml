name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Lint · typecheck
  # ─────────────────────────────────────────────────────────────────────────
  ci:
    name: lint · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Auto-tag + publish — only on direct push to main after green CI.
  #
  # GitHub Actions does NOT trigger workflows from tags pushed by GITHUB_TOKEN,
  # so the build and publish steps live here in the same workflow instead of a
  # separate publish.yaml that would never fire.
  #
  # Skips silently if the tag already exists (idempotent).
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Tag · build · publish
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write   # push git tag
      id-token: write   # OIDC trusted publishing to PyPI

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Read version ───────────────────────────────────────────────────
      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep '^version' packages/giulia/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # ── Check / create tag ─────────────────────────────────────────────
      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "Tagged ${{ steps.version.outputs.tag }}"

      - name: Tag already exists — skipping publish
        if: steps.tag_check.outputs.exists == 'true'
        run: echo "Tag ${{ steps.version.outputs.tag }} already exists, nothing to do."

      # ── Build ──────────────────────────────────────────────────────────
      - name: Install uv
        if: steps.tag_check.outputs.exists == 'false'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        if: steps.tag_check.outputs.exists == 'false'
        working-directory: packages/giulia
        run: uv build --out-dir ../../dist

      # ── Publish ────────────────────────────────────────────────────────
      - name: Publish to PyPI (OIDC)
        if: steps.tag_check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
